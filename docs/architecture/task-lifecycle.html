<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A task, from queued to your decision</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F2F2F7;
      --color-ink:     #1C1C1E;
      --color-muted:   #636366;
      --color-accent:  #8F6202;
      --font-sans:     system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1032px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 992px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Botbench</p>
    <h1>A task, from queued to your decision</h1>

        <desc id="botbench-task-lifecycle-desc">Lifecycle of a Botbench task: Queued, Working, Checking and Reviewing lead to Ready for review, where the owner accepts or rejects; failed checks and review concerns send it back to Working, and a usage limit makes it wait and try again.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066CC"/></marker>
          <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1C1C1E"/></marker>

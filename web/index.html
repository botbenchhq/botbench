<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The browser bar is the theme's surface for the mode shown; the script below and src/app/appearance.ts set it. -->
    <meta name="theme-color" content="#161618" />
    <!-- Applies the appearance chosen on this device before the first paint (see src/app/appearance.ts, which does the same once the client runs). Botbench allows this one script by its hash. -->
    <script>(function(){var c="dark";try{var s=localStorage.getItem("botbench.appearance");if(s==="light"||s==="auto")c=s}catch(e){}var d=c==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):c;document.documentElement.setAttribute("data-theme",c);document.querySelector('meta[name="theme-color"]').setAttribute("content",d==="light"?"#F2F2F7":"#161618")})()</script>
    <meta name="apple-mobile-web-app-title" content="Botbench" />
    <link rel="icon" href="/src/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/src/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Botbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
